[package]
name = "rebased-lite"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Rebased Lite: a light, read-only git graph and compare tool"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rebased-service = { path = "../service" }
tauri = { version = "2", features = [] }
serde = "1"
serde_json = "1"

[features]
# Serves the embedded UI. `tauri dev` turns it off to load the Vite dev server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
